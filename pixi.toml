[workspace]
name = "shipgeometryservice"
description = "SHiP geometry service library (framework-agnostic)"
channels = ["https://prefix.dev/ship", "conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]
requires-pixi = ">=0.68"

# Lets downstream dev environments (aegir, ...) consume the geometry service
# from source: `shipgeometryservice = { path = "../geometry_service" }`.
# Mirrors ship-conda-recipes/recipes/shipgeometryservice (the release recipe);
# keep the version and the host dependencies in lockstep with it. To
# co-develop the geometry itself, point shipgeometry below at a sibling
# checkout: `shipgeometry = { path = "../geometry" }`.
[package]
name = "shipgeometryservice"
version = "0.4.0"

[package.build]
backend = { name = "pixi-build-cmake", version = "0.*" }

[package.build.config]
extra-args = [
    "-DCMAKE_INSTALL_LIBDIR=lib",
    "-DBUILD_TESTING=OFF",
]

# eigen-abi-devel and nlohmann_json are needed for the same GeoModel CMake
# config reasons documented in the release recipe.
[package.host-dependencies]
shipgeometry = "*"
geomodel-core = "*"
geomodel-g4 = "*"
geant4 = "*"
# Geant4Config.cmake calls find_dependency() on EXPAT, ZLIB and Freetype, each
# of which needs headers and a CMake config. Since the v1-recipe modernisation
# (conda-forge/geant4-feedstock#104) conda-forge geant4 brings in only the
# runtime libexpat / libzlib / libfreetype, so find_package(Geant4) fails unless
# the environment supplies these itself. The release recipe lists the same three.
expat = "*"
zlib = "*"
freetype = "*"
mp-units = "*"
eigen-abi-devel = "*"
nlohmann_json = "*"

[dependencies]
cxx-compiler = "*"
cmake = ">=3.24"
make = "*"
ninja = "*"
git = "*"
shipgeometry = "*"
geomodel = ">=6.22"
# Geant4 arrives here through geomodel, and its CMake config needs the same
# three as [package.host-dependencies] above.
expat = "*"
zlib = "*"
freetype = "*"
# Required by GeoModelTools' CMake config (find_dependency via SHiPGeometry);
# not declared as a run dependency by the shipgeometry package itself.
nlohmann_json = "*"
eigen-abi-devel = "*"

# Static analysis. clang-tidy lives here rather than in [feature.lint] because
# it replays the commands in compile_commands.json and so needs the same
# headers the compiler saw; feature.lint is a separate solve group and could
# drift from them. clang-tools provides clang-tidy but does not depend on the
# clang package that ships clang's own builtin headers (stddef.h and friends),
# and without those every translation unit fails to parse.
# Both carry the >=19 floor that .clang-tidy's ExcludeHeaderFilterRegex needs,
# and they have to resolve to the same major: clang-tidy looks for its builtin
# headers under lib/clang/<major>/include, which is what the clang package
# supplies. Both come from the same llvm feedstock, so conda keeps them in step.
clang = ">=19"
clang-tools = ">=19"

[tasks]
# CMAKE_PREFIX_PATH is passed explicitly: conda-forge's cxx-compiler 2.x dropped
# the *_linux-64 activation packages that used to export it, and without it CMake
# prefers system libraries (e.g. /usr expat, via the pkg-config HINTS in
# FindEXPAT) over the ones in this environment.
configure = { cmd = """
cmake -S . -B build -G Ninja \
    -DCMAKE_BUILD_TYPE=RelWithDebInfo \
    -DCMAKE_PREFIX_PATH=$CONDA_PREFIX \
""" }
build = { cmd = "cmake --build build -j", depends-on = ["configure"] }
test = { cmd = "ctest --test-dir build --output-on-failure --no-tests=error", depends-on = ["build"] }

# Linting / formatting toolchain. prek orchestrates the hooks; the tools come
# from this environment so versions are tracked in pixi.lock and run identically
# everywhere (including NixOS). See .pre-commit-config.yaml.

# Static analysis, mirroring ShipSoft/.github's clang-tidy.yml. `clang-tidy`
# reports the whole tree; `clang-tidy-diff` reports only what CI gates on,
# namely findings on lines you changed relative to main. -source-filter is a
# Python regex (run-clang-tidy is a Python script), unlike the llvm::Regex
# patterns in .clang-tidy. These use TOML literal strings so the backslashes
# survive.
clang-tidy = { cmd = '''
run-clang-tidy -p build -j $(nproc) -quiet \
    -source-filter '^(?!.*(/G__|Dict[.]cxx|/_deps/|/CMakeFiles/)).*' \
    -extra-arg=-isystem$CONDA_PREFIX/include
''', depends-on = ["build"] }
# clang-tidy-diff.py ships with clang-tools but is not on PATH. Diffing against
# origin/main alone, with no second commit, includes staged and unstaged work, so
# this sees the patch in your tree rather than only what you have committed.
#
# It is a quick check, not the same thing CI does: clang-tidy-diff only looks at
# files in the compilation database, so a changed *header* is not analysed here.
# CI maps headers to the translation units that include them. For a header-only
# change, run `pixi run clang-tidy` or let CI report it.
clang-tidy-diff = { cmd = '''
git diff --unified=0 --diff-filter=d origin/main -- '*.cpp' '*.hpp' '*.cxx' '*.h' \
  | python $CONDA_PREFIX/share/clang/clang-tidy-diff.py -p1 -path build -j $(nproc) \
      -quiet -only-check-in-db -extra-arg=-isystem$CONDA_PREFIX/include
''', depends-on = ["build"] }

[feature.lint.dependencies]
prek = "*"
python = ">=3.11"
clang-format = "23.*"
codespell = "*"
reuse = "*"
cffconvert = "*"
commitizen = "*"

# Pinned via PyPI: conda-forge's gersemi lags the version the other SHiP
# repos standardised on, and reflows CMake differently.
[feature.lint.pypi-dependencies]
gersemi = "==0.29.1"

[feature.lint.tasks]
lint = "prek run --all-files"
# Install the git hooks and route them through `pixi run` so the conda-provided
# hook tools are on PATH at commit time (required on NixOS, where the tools are
# not runnable without pixi activation).
install-hooks = '''
prek install --hook-type pre-commit --hook-type commit-msg
hooks=$(git rev-parse --git-path hooks)
sed -i 's#"$PREK" hook-impl#pixi run -e lint prek hook-impl#' "$hooks/pre-commit"
sed -i 's#"$PREK" hook-impl#pixi run -e lint prek hook-impl#' "$hooks/commit-msg"
'''

# --- Multi-package development (opt-in) -------------------------------------
# Build shipgeometry from a sibling checkout instead of the released conda
# package: uncomment this block and the `dev` environment below, then run
# e.g. `pixi run -e dev build`. Do NOT commit the uncommented block or the
# pixi.lock changes it causes: the committed lock must stay resolvable
# without sibling checkouts, and pixi validates every environment even when
# only the default one is used. See the Developer Guide (SHiP Documentation
# site) for the full workflow.
#
# [feature.dev.dependencies]
# shipgeometry = { path = "../geometry" }

[environments]
default = { solve-group = "default" }
lint = { features = ["lint"], solve-group = "lint" }
# dev = { features = ["dev"] }  # multi-package dev, see block above
